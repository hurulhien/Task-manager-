<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Task Manager | Hurulhien</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
  body{background:#f4f6fb;padding:20px}
  .container{max-width:600px;margin:30px auto;background:#fff;padding:25px;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,0.1)}
  h1{text-align:center;color:#1a1a2e;margin-bottom:5px}
  p{text-align:center;color:#666;margin-bottom:20px}
  .input-box{display:flex;gap:10px}
  input{flex:1;padding:12px;border:1px solid #ddd;border-radius:8px;outline:none}
  button{padding:12px 18px;background:#2563eb;color:#fff;border:none;border-radius:8px;cursor:pointer}
  button:hover{background:#1d4ed8}
  ul{list-style:none;margin-top:20px}
  li{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid #eee}
  li.done span{text-decoration:line-through;color:#999}
  .delete{background:#ef4444;padding:6px 10px;font-size:13px}
</style>
</head>
<body>
<div class="container">
  <h1>My Task Manager</h1>
  <p>Built by Hurulhien - Full-Stack Developer</p>
  <div class="input-box">
    <input type="text" id="taskInput" placeholder="Enter a new task...">
    <button onclick="addTask()">Add Task</button>
  </div>
  <ul id="taskList"></ul>
</div>
<script>
  let tasks = JSON.parse(localStorage.getItem('tasks')) || [];
  function saveTasks(){ localStorage.setItem('tasks', JSON.stringify(tasks)); }
  function renderTasks(){
    const list = document.getElementById('taskList');
    list.innerHTML = '';
    tasks.forEach((task, index) => {
      const li = document.createElement('li');
      if(task.done) li.classList.add('done');
      li.innerHTML = `<span onclick="toggleTask(${index})" style="cursor:pointer">${task.text}</span>
      <button class="delete" onclick="deleteTask(${index})">Delete</button>`;
      list.appendChild(li);
    });
  }
  function addTask(){
    const input = document.getElementById('taskInput');
    if(input.value.trim() === '') return alert('Please enter a task');
    tasks.push({text: input.value, done: false});
    input.value = ''; saveTasks(); renderTasks();
  }
  function toggleTask(i){ tasks[i].done = !tasks[i].done; saveTasks(); renderTasks(); }
  function deleteTask(i){ tasks.splice(i,1); saveTasks(); renderTasks(); }
  renderTasks();
</script>
</body>
</html>
